<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.3"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1500" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1500" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1500" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1500" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="500" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Decorative orb left -->
  <circle cx="100" cy="400" r="300" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative orb right -->
  <circle cx="1400" cy="100" r="250" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Trading chart line - background -->
  <path d="M0 400 Q150 380, 300 350 T600 280 T900 320 T1200 200 T1500 180"
        fill="url(#chartGrad)" stroke="none"/>

  <!-- Trading chart line - stroke -->
  <path d="M0 400 Q150 380, 300 350 T600 280 T900 320 T1200 200 T1500 180"
        fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Data points on chart -->
  <circle cx="300" cy="350" r="6" fill="#3b82f6"/>
  <circle cx="600" cy="280" r="6" fill="#3b82f6"/>
  <circle cx="900" cy="320" r="6" fill="#10b981"/>
  <circle cx="1200" cy="200" r="6" fill="#10b981"/>

  <!-- Logo and text - centered -->
  <g transform="translate(750, 250)">
    <!-- FX Icon -->
    <rect x="-280" y="-60" width="100" height="100" rx="20" fill="#1a1a24" stroke="#2a2a3a" stroke-width="2"/>
    <text x="-230" y="10" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700" text-anchor="middle" fill="url(#brandGrad)">FX</text>
    <path d="M-265 30 L-250 22 L-235 26 L-215 12 L-200 16 L-190 5" stroke="url(#brandGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Brand name -->
    <text x="-50" y="5" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" fill="url(#brandGrad)">FX</text>
    <text x="50" y="5" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Ethos</text>

    <!-- Slogan -->
    <text x="60" y="50" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#a0a0b0" letter-spacing="3" text-anchor="middle">TRADE SMARTER</text>
  </g>

  <!-- Subtle bottom accent line -->
  <rect x="0" y="496" width="1500" height="4" fill="url(#brandGrad)"/>
</svg>
